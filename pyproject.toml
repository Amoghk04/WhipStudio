[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-whipstudio"
version = "0.1.0"
description = "ML Debug environment for OpenEnv"
requires-python = ">=3.11"
dependencies = [
    "openenv-core[core]>=0.2.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "gradio>=4.0.0",
    "torch>=2.2.0",
    "smolagents>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "server.app:main"
ml-debug-server = "server.app:main"
whipstudio-ui = "gradio_app:main"

[tool.setuptools]
include-package-data = true
packages = ["WhipStudio", "WhipStudio.server", "WhipStudio.server.tasks"]
package-dir = { "WhipStudio" = ".", "WhipStudio.server" = "server", "WhipStudio.server.tasks" = "server/tasks" }
