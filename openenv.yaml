
spec_version: 2
name: whipstudio
type: space
runtime: fastapi
app: server.app:app
port: 7860

metadata:
  title: WhipStudio Env
  version: "1.1.0"
  description: >
    OpenEnv-compatible RL environment where agents debug broken PyTorch
    training scripts across five tasks with continuous reward scoring.
  author: Amogh-kal1
  license: Apache-2.0
  repository: Amogh-kal1/whipstudio
  tags:
    - openenv
    - rl
    - ml-debugging
    - fastapi
    - gradio

compute:
  python_version: "3.11"
  cpu: 2
  memory_gb: 16
  gpu: false

service:
  host: 0.0.0.0
  port: 7860
  health_path: /health
  base_path: /
  web_path: /web
  ui_path: /ui
  docs_path: /docs
  endpoints:
    - method: POST
      path: /reset
    - method: POST
      path: /step
    - method: GET
      path: /state
    - method: GET
      path: /tasks
    - method: POST
      path: /grader
    - method: GET
      path: /baseline
    - method: GET
      path: /baseline/task/{task_id}
    - method: GET
      path: /baseline/health

tasks:
  - id: task1
    name: Broken training loop
    difficulty: easy
    max_steps: 8
  - id: task2
    name: Silent NaN loss
    difficulty: medium
    max_steps: 10
  - id: task3
    name: OOM and data leakage
    difficulty: hard
    max_steps: 12
  - id: task4
    name: Wrong loss function
    difficulty: medium
    max_steps: 10
  - id: task5
    name: Frozen backbone
    difficulty: medium
    max_steps: 10
  - id: task6
    name: Mixed precision instability
    difficulty: hard
    max_steps: 15
